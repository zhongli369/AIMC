<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline';">
  <title>AIMC Launcher</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>AIMC</h1>
      <span class="subtitle">AI Minecraft Companion</span>
      <span id="status-dot" class="status-dot stopped" title="Bot Status"></span>
    </header>

    <form id="config-form">
      <div class="field">
        <label for="apiKey">API Key</label>
        <input type="password" id="apiKey" placeholder="sk-..." autocomplete="off">
      </div>

      <div class="field-row">
        <div class="field flex-2">
          <label for="host">Server IP</label>
          <input type="text" id="host" placeholder="127.0.0.1">
        </div>
        <div class="field flex-1">
          <label for="port">Port</label>
          <input type="number" id="port" placeholder="55916" min="1" max="65535">
        </div>
      </div>

      <div class="field-row">
        <div class="field flex-1">
          <label for="botName">Bot Name</label>
          <input type="text" id="botName" placeholder="AIMC">
        </div>
        <div class="field flex-1">
          <label for="model">Model</label>
          <select id="model">
            <optgroup label="DeepSeek">
              <option value="deepseek-chat">DeepSeek V4 (Chat)</option>
              <option value="deepseek-reasoner">DeepSeek (Reasoner)</option>
            </optgroup>
            <optgroup label="OpenAI">
              <option value="gpt-4o">GPT-4o</option>
              <option value="gpt-4o-mini">GPT-4o Mini</option>
            </optgroup>
            <optgroup label="Anthropic">
              <option value="claude-sonnet-4-6">Claude Sonnet 4.6</option>
              <option value="claude-opus-4-7">Claude Opus 4.7</option>
              <option value="claude-haiku-4-5">Claude Haiku 4.5</option>
            </optgroup>
            <optgroup label="Google">
              <option value="gemini-2.5-pro">Gemini 2.5 Pro</option>
              <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
            </optgroup>
            <optgroup label="Doubao (豆包)">
              <option value="doubao-seed-1-6">豆包 Seed 1.6</option>
              <option value="doubao-seed-1-6-lite">豆包 Seed 1.6 Lite</option>
              <option value="doubao-seed-1-6-flash">豆包 Seed 1.6 Flash</option>
              <option value="doubao-seed-2-0-pro">豆包 Seed 2.0 Pro</option>
              <option value="doubao-seed-2-0-lite">豆包 Seed 2.0 Lite</option>
            </optgroup>
            <optgroup label="Other">
              <option value="mistral-large">Mistral Large</option>
              <option value="grok-3">Grok 3</option>
              <option value="qwen-max">Qwen Max</option>
            </optgroup>
          </select>
        </div>
      </div>

      <div class="field" id="doubao-endpoint-group" style="display:none">
        <label for="doubaoEndpointId">豆包推理接入点 ID (ep-xxx)</label>
        <input type="text" id="doubaoEndpointId" placeholder="ep-xxxxxxxxxx" autocomplete="off">
      </div>
    </form>

    <div class="actions">
      <button id="btn-start" class="btn btn-start">Start Bot</button>
      <button id="btn-stop" class="btn btn-stop" disabled>Stop Bot</button>
      <button id="btn-save" class="btn btn-save">Save Config</button>
      <button id="btn-dashboard" class="btn btn-dashboard" title="Open AI Dashboard">Dashboard</button>
    </div>

    <div class="console-container">
      <div class="console-header">
        <span>Console</span>
        <button id="btn-clear" class="btn-clear">Clear</button>
      </div>
      <pre id="console-output" class="console-output"></pre>
      <div class="chat-bar">
        <input type="text" id="chat-input" class="chat-input" placeholder="Type a message to the bot..." disabled autocomplete="off">
        <button id="btn-send" class="btn btn-send" disabled>Send</button>
        <button id="btn-mic" class="btn btn-mic" disabled title="Record voice (hold/click to toggle)">&#x1F3A4;</button>
        <span id="voice-status" class="voice-status hidden"></span>
        <button id="btn-voice-sim" class="btn btn-voice-sim" disabled title="Send as voice_sim (dev-only)">VS</button>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
